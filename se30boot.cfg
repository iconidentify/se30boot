# se30boot.cfg - the menu se30boot shows when the SE/30 starts up.
#
#   timeout SECONDS     before the default boots (-1 waits for a key)
#   default N           the Nth entry, or an entry's title
#   title NAME          starts an entry, followed by:
#     kernel PATH       a kernel on this volume, gzipped or not
#     append LINE       the kernel's command line
#   or
#     macos             carry on starting Mac OS
#
# In the menu, E edits an entry's command line for one boot.
timeout 5
default Mac OS 7.1

title Linux
kernel Linux:vmlinux
append console=ttyS0,9600 console=tty0

title se30os
kernel Linux:se30os.gz

title Mac OS 7.1
macos
